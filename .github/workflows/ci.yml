name: CI/CD HealthyPosture

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ─────────────────────────────────────────────
  # CI: Lint, Build, Test
  # ─────────────────────────────────────────────
  ci-backend:
    name: CI - Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Check server can start
        run: |
          timeout 10 node src/server.js &
          sleep 5
          curl -f http://localhost:5000/ || exit 1
          kill %1 || true
        working-directory: server
        env:
          PORT: 5000
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: healthy_posture_ai
          JWT_SECRET: ci_test_secret
          CORS_ORIGIN: http://localhost:3000

  ci-frontend:
    name: CI - Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build Frontend (Vite)
        run: npm run build
        working-directory: client
        env:
          VITE_API_URL: https://healthy-posture-ai.onrender.com

  # ─────────────────────────────────────────────
  # CD: Auto-deploy setelah CI sukses
  # ─────────────────────────────────────────────
  cd-backend-render:
    name: CD - Deploy Backend (Render)
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" \
            | grep -q "200\|201" && echo "Deploy triggered!" || echo "Deploy hook failed"

  cd-frontend-vercel:
    name: CD - Deploy Frontend (Vercel)
    needs: [ci-backend, ci-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Info
        run: |
          echo "Frontend auto-deploys via Vercel Git Integration."
          echo "Vercel detects push to main and deploys automatically."
          echo "No manual trigger needed."
