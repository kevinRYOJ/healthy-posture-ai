services:
  postgres:
    image: postgres:14
    container_name: healthy-posture-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: healthy_posture_ai
    ports:
      - "5432:5432"

  backend:
    build: ./server
    container_name: healthy-posture-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: admin
      PGDATABASE: healthy_posture_ai
      JWT_SECRET: healthposture_secret
      GEMINI_API_KEY: your_gemini_api_key_here
      PYTHON_PATH: python3
      CORS_ORIGIN: http://localhost:3000

  frontend:
    build: ./client
    container_name: healthy-posture-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
